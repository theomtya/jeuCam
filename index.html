<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ÉVITE ARNAUD</title>
<style>
  :root{
    --dark:#0a0705; --grey:#2a2420;
    --red:#e63946; --red-dark:#9b1d23; --orange:#f4831f;
    --cream:#f1e8d8; --muted-1:#b89070; --muted-3:#8a6050; --muted-5:#5a4030;
    --ease-out:cubic-bezier(0.23,1,0.32,1);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;}
  body{
    background:var(--dark); color:var(--cream);
    font-family:'Georgia',serif;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:none;
  }
  body::before{
    content:''; position:fixed; inset:0; z-index:200; pointer-events:none; opacity:.03;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  #game{position:fixed; inset:0; display:block; z-index:1;}

  #hud{
    position:fixed; top:0; left:0; right:0; z-index:10;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:20px 24px; pointer-events:none;
  }
  .hud-block{ text-align:left; }
  .hud-block.right{ text-align:right; }
  .hud-label{ font-size:10px; letter-spacing:4px; text-transform:uppercase; color:var(--muted-3); }
  .hud-value{ font-size:34px; font-weight:900; color:var(--cream); line-height:1; margin-top:2px; }
  .hud-value.accent{ color:var(--red); }

  .overlay{
    position:fixed; inset:0; z-index:20;
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    text-align:center; padding:40px 28px;
    background:radial-gradient(ellipse at 50% 55%, rgba(42,10,10,.92) 0%, rgba(10,7,5,.96) 70%);
    -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
  }
  .overlay.hidden{ display:none; }

  .badge{
    display:inline-block; background:var(--red); color:#fff;
    font-size:11px; font-weight:bold; letter-spacing:3px; text-transform:uppercase;
    padding:6px 18px; border-radius:2px; margin-bottom:26px;
  }
  h1{
    font-size:clamp(48px,13vw,110px); font-weight:900; line-height:.9;
    text-transform:uppercase; letter-spacing:-4px;
  }
  h1 .r{ color:var(--red); }
  .sub{
    font-size:16px; font-style:italic; color:var(--muted-1);
    line-height:1.6; margin-top:20px; max-width:440px;
  }
  .over-title{
    font-size:clamp(40px,9vw,80px); font-weight:900; text-transform:uppercase;
    letter-spacing:-3px; color:var(--red); line-height:.95;
  }
  #finalMsg{ margin-top:16px; }
  .score-row{ display:flex; gap:48px; margin-top:30px; }
  .score-item .n{ font-size:56px; font-weight:900; color:var(--cream); line-height:1; }
  .score-item .n.accent{ color:var(--red); }
  .score-item .l{ font-size:10px; letter-spacing:3px; text-transform:uppercase; color:var(--muted-3); margin-top:8px; }

  .btn{
    display:inline-block; background:var(--red); color:#fff; border:none; cursor:pointer;
    font-family:'Georgia',serif; font-size:14px; letter-spacing:3px; text-transform:uppercase; font-weight:bold;
    padding:18px 46px; border-radius:4px; margin-top:38px;
    transition:background .2s ease, transform .15s ease;
  }
  .btn:hover{ background:var(--red-dark); transform:scale(1.03); }
  .btn:active{ transform:scale(.97); }
  .btn.ghost{
    background:transparent; border:1px solid var(--muted-5); color:var(--muted-1);
    padding:12px 28px; font-size:11px; margin-top:18px;
  }
  .btn.ghost:hover{ border-color:var(--red); color:var(--cream); background:transparent; }

  .hint{ font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--muted-5); margin-top:32px; }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
  <div class="hud-block">
    <div class="hud-label">Mètres d'avance</div>
    <div class="hud-value" id="scoreVal">0</div>
  </div>
  <div class="hud-block right">
    <div class="hud-label">Record</div>
    <div class="hud-value accent" id="bestVal">0</div>
  </div>
</div>

<!-- MENU -->
<div class="overlay" id="menu">
  <span class="badge">⚠ Le collègue relou</span>
  <h1>ÉVITE<br><span class="r">ARNAUD</span></h1>
  <p class="sub">Camille traverse l'open space. Arnaud rôde dans les couloirs. Surtout, ne le croise pas — esquive-le le plus longtemps possible.</p>
  <button class="btn" id="startBtn">C'est parti</button>
  <div class="hint" id="ctrlHint">Flèches / WASD — ou glisse ton doigt</div>
</div>

<!-- GAME OVER -->
<div class="overlay hidden" id="gameover">
  <span class="over-title">Repérée !</span>
  <p class="sub" id="finalMsg"></p>
  <div class="score-row">
    <div class="score-item"><div class="n" id="finalScore">0</div><div class="l">Mètres</div></div>
    <div class="score-item"><div class="n accent" id="finalBest">0</div><div class="l">Record</div></div>
  </div>
  <button class="btn" id="retryBtn">Re-esquiver</button>
  <button class="btn ghost" id="menuBtn">Menu</button>
</div>

<script>
"use strict";
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  // ---------- Dimensions responsives ----------
  let W = 0, H = 0, DPR = 1;
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    computeAisle();
  }

  // ---------- Couloir / allée ----------
  let aisle = { x:0, w:0 };
  function computeAisle(){
    aisle.w = Math.min(W * 0.62, 480);
    aisle.x = (W - aisle.w) / 2;
  }

  // ---------- Assets (images chargées depuis les fichiers voisins) ----------
  // Dépose à côté de index.html : camille.png, arnaud.png, plante.png, photocopieuse.png
  const OBS_COLORS = ['#4a6a8a', '#4c7a3a', '#8a6050'];
  const assets = {
    perso: makeAsset('camille.png'),
    obstacles: [ makeAsset('arnaud.png'), makeAsset('plante.png'), makeAsset('photocopieuse.png') ]
  };
  function makeAsset(src){
    const a = { img:new Image(), loaded:false };
    a.img.onload = ()=>{ a.loaded = true; };
    a.img.onerror = ()=>{ a.loaded = false; };
    if(src) a.img.src = src;
    return a;
  }

  // ---------- État ----------
  const STATE = { MENU:0, PLAYING:1, OVER:2 };
  let state = STATE.MENU;
  let player, obstacles, score, best, speed, spawnTimer, spawnGap, scrollAcc;

  function loadBest(){ try{ const v=parseInt(localStorage.getItem('arnaud_best')||'0',10); return isNaN(v)?0:v; }catch(e){ return 0; } }
  function saveBest(v){ try{ localStorage.setItem('arnaud_best', String(v)); }catch(e){} }
  best = loadBest();

  const DEATH_MSGS = [
    "Arnaud t'a coincée à la machine à café.",
    "Trop tard : « T'as deux minutes ? »",
    "Il a lancé un « ça va sinon ? ». Fatal.",
    "Réunion surprise avec Arnaud. RIP.",
    "Il t'a vue. Impossible de faire semblant.",
    "« J'te raconte pas mon week-end… » Terminé."
  ];

  function resetGame(){
    const pw = Math.max(46, Math.min(aisle.w * 0.2, 82));
    player = { w:pw, h:pw*1.25, x:W/2, y:H*0.78, tx:W/2, ty:H*0.78, hasTarget:false };
    obstacles = [];
    score = 0;
    speed = Math.max(H * 0.5, 360);
    spawnTimer = 0;
    spawnGap = 1.0;
    scrollAcc = 0;
  }

  // ---------- Entrées ----------
  const keys = {};
  window.addEventListener('keydown', e=>{
    keys[e.key.toLowerCase()] = true;
    if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase())) e.preventDefault();
    if(state!==STATE.PLAYING && (e.key===' '||e.key==='Enter')){ startGame(); }
  }, {passive:false});
  window.addEventListener('keyup', e=>{ keys[e.key.toLowerCase()] = false; });

  function pointerMove(cx, cy){ if(!player) return; player.hasTarget=true; player.tx=cx; player.ty=cy; }
  canvas.addEventListener('mousemove', e=>{ if(e.buttons) pointerMove(e.clientX, e.clientY); });
  canvas.addEventListener('mousedown', e=>{ pointerMove(e.clientX, e.clientY); });
  canvas.addEventListener('touchstart', e=>{ const t=e.touches[0]; pointerMove(t.clientX,t.clientY); e.preventDefault(); }, {passive:false});
  canvas.addEventListener('touchmove', e=>{ const t=e.touches[0]; pointerMove(t.clientX,t.clientY); e.preventDefault(); }, {passive:false});

  // ---------- Spawns ----------
  function spawnObstacle(){
    const size = Math.max(44, Math.min(aisle.w * 0.2, 78));
    const margin = size/2 + 6;
    const x = aisle.x + margin + Math.random() * (aisle.w - margin*2);
    // Arnaud (type 0) sort plus souvent que les objets
    let type = 0;
    const r = Math.random();
    if(r > 0.55) type = (Math.random() < 0.5) ? 1 : 2;
    obstacles.push({ x, y:-size, w:size, h:size, type });
  }

  // ---------- Update ----------
  function update(dt){
    if(state !== STATE.PLAYING) return;
    speed += dt * 13;
    spawnGap = Math.max(0.45, 1.0 - score * 0.0006);
    scrollAcc += speed * dt;
    score += speed * dt * 0.05;

    const pspeed = Math.max(H, 700) * dt * 0.9;
    if(player.hasTarget){
      player.x += (player.tx - player.x) * Math.min(1, dt*14);
      player.y += (player.ty - player.y) * Math.min(1, dt*14);
    }
    if(keys['arrowleft']||keys['a']||keys['q']){ player.x -= pspeed; player.hasTarget=false; }
    if(keys['arrowright']||keys['d']){ player.x += pspeed; player.hasTarget=false; }
    if(keys['arrowup']||keys['w']||keys['z']){ player.y -= pspeed; player.hasTarget=false; }
    if(keys['arrowdown']||keys['s']){ player.y += pspeed; player.hasTarget=false; }

    const mx = player.w/2 + 4;
    player.x = Math.max(aisle.x + mx, Math.min(aisle.x + aisle.w - mx, player.x));
    player.y = Math.max(H*0.35, Math.min(H - player.h/2 - 12, player.y));
    if(player.hasTarget){ player.tx = player.x; player.ty = player.y; }

    spawnTimer += dt;
    if(spawnTimer >= spawnGap){ spawnTimer = 0; spawnObstacle(); }

    for(let i=obstacles.length-1; i>=0; i--){
      const o = obstacles[i];
      o.y += speed * dt;
      if(o.y - o.h/2 > H){ obstacles.splice(i,1); continue; }
      if(Math.abs(o.x - player.x) < (o.w+player.w)*0.5*0.72 &&
         Math.abs(o.y - player.y) < (o.h+player.h)*0.5*0.72){
        gameOver();
      }
    }
    scoreEl.textContent = Math.floor(score);
    bestEl.textContent = best;
  }

  // ---------- Rendu décor bureau ----------
  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function drawDeskColumn(cx, colW){
    const period = 130;
    const off = scrollAcc % period;
    for(let y = off - period; y < H + period; y += period){
      const dw = colW * 0.72, dh = 64;
      const dx = cx - dw/2, dy = y;
      ctx.fillStyle = '#221a15';
      roundRect(dx, dy, dw, dh, 6); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.04)'; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = 'rgba(244,131,31,0.35)';
      ctx.fillRect(dx + dw*0.18, dy + 8, dw*0.64, dh*0.34);
      ctx.fillStyle = '#181210';
      ctx.beginPath(); ctx.arc(cx, dy + dh + 20, dw*0.22, 0, Math.PI*2); ctx.fill();
    }
  }

  function drawOffice(){
    ctx.fillStyle = '#0a0705';
    ctx.fillRect(0,0,W,H);

    const leftW = aisle.x, rightW = W - (aisle.x + aisle.w);
    if(leftW > 30) drawDeskColumn(aisle.x/2, leftW);
    if(rightW > 30) drawDeskColumn(aisle.x + aisle.w + rightW/2, rightW);

    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#241a14'); g.addColorStop(1,'#181009');
    ctx.fillStyle = g;
    ctx.fillRect(aisle.x, 0, aisle.w, H);

    ctx.fillStyle = 'rgba(230,57,70,0.55)';
    ctx.fillRect(aisle.x-4, 0, 4, H);
    ctx.fillRect(aisle.x+aisle.w, 0, 4, H);

    ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = 2;
    const tile = 90, off = scrollAcc % tile;
    for(let y = off - tile; y < H; y += tile){
      ctx.beginPath(); ctx.moveTo(aisle.x, y); ctx.lineTo(aisle.x+aisle.w, y); ctx.stroke();
    }

    const v = ctx.createRadialGradient(W/2,H/2,H*0.3, W/2,H/2,H*0.78);
    v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,0.6)');
    ctx.fillStyle = v; ctx.fillRect(0,0,W,H);
  }

  function drawPlayer(){
    const p = player;
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath(); ctx.ellipse(p.x, p.y + p.h*0.42, p.w*0.42, p.h*0.12, 0, 0, Math.PI*2); ctx.fill();
    if(assets.perso.loaded){
      ctx.drawImage(assets.perso.img, p.x - p.w/2, p.y - p.h/2, p.w, p.h);
    } else {
      ctx.fillStyle = '#e8b8a0';
      ctx.beginPath(); ctx.arc(p.x, p.y - p.h*0.28, p.w*0.24, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#f1e8d8';
      roundRect(p.x - p.w*0.32, p.y - p.h*0.06, p.w*0.64, p.h*0.5, 8); ctx.fill();
      ctx.fillStyle = '#e63946';
      roundRect(p.x - p.w*0.32, p.y - p.h*0.06, p.w*0.64, p.h*0.16, 8); ctx.fill();
    }
  }

  function drawArnaud(o){
    ctx.fillStyle = '#dda882';
    ctx.beginPath(); ctx.arc(o.x, o.y - o.h*0.24, o.w*0.24, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#4a6a8a';
    roundRect(o.x - o.w*0.34, o.y - o.h*0.02, o.w*0.68, o.h*0.5, 7); ctx.fill();
    ctx.fillStyle = '#e63946';
    ctx.beginPath();
    ctx.moveTo(o.x, o.y - o.h*0.02);
    ctx.lineTo(o.x - o.w*0.07, o.y + o.h*0.1);
    ctx.lineTo(o.x, o.y + o.h*0.34);
    ctx.lineTo(o.x + o.w*0.07, o.y + o.h*0.1);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#0a0705';
    ctx.beginPath(); ctx.arc(o.x - o.w*0.08, o.y - o.h*0.26, o.w*0.035, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(o.x + o.w*0.08, o.y - o.h*0.26, o.w*0.035, 0, Math.PI*2); ctx.fill();
  }

  function drawObstacle(o){
    const a = assets.obstacles[o.type];
    if(a && a.loaded){ ctx.drawImage(a.img, o.x - o.w/2, o.y - o.h/2, o.w, o.h); return; }
    if(o.type === 0){ drawArnaud(o); return; }
    if(o.type === 1){
      ctx.fillStyle = '#8a5a30';
      roundRect(o.x - o.w*0.2, o.y + o.h*0.08, o.w*0.4, o.h*0.32, 4); ctx.fill();
      ctx.fillStyle = '#4c7a3a';
      for(let i=-1;i<=1;i++){
        ctx.beginPath();
        ctx.ellipse(o.x + i*o.w*0.16, o.y - o.h*0.12, o.w*0.14, o.h*0.28, i*0.4, 0, Math.PI*2);
        ctx.fill();
      }
    } else {
      ctx.fillStyle = '#6a6560';
      roundRect(o.x - o.w*0.34, o.y - o.h*0.34, o.w*0.68, o.h*0.68, 6); ctx.fill();
      ctx.fillStyle = '#0a0705';
      ctx.fillRect(o.x - o.w*0.26, o.y - o.h*0.16, o.w*0.52, o.h*0.1);
      ctx.fillStyle = 'rgba(244,131,31,0.7)';
      ctx.fillRect(o.x + o.w*0.12, o.y + o.h*0.06, o.w*0.1, o.h*0.06);
    }
  }

  function render(){
    drawOffice();
    for(const o of obstacles) drawObstacle(o);
    if(player && state !== STATE.MENU) drawPlayer();
  }

  // ---------- Boucle ----------
  let last = performance.now();
  function loop(now){
    let dt = (now - last) / 1000; last = now;
    if(dt > 0.05) dt = 0.05;
    update(dt); render();
    requestAnimationFrame(loop);
  }

  // ---------- Transitions ----------
  const menuEl = document.getElementById('menu');
  const overEl = document.getElementById('gameover');
  const scoreEl = document.getElementById('scoreVal');
  const bestEl = document.getElementById('bestVal');

  function startGame(){
    resetGame(); state = STATE.PLAYING;
    menuEl.classList.add('hidden'); overEl.classList.add('hidden');
  }
  function gameOver(){
    state = STATE.OVER;
    const s = Math.floor(score);
    if(s > best){ best = s; saveBest(best); }
    document.getElementById('finalScore').textContent = s;
    document.getElementById('finalBest').textContent = best;
    document.getElementById('finalMsg').textContent = DEATH_MSGS[Math.floor(Math.random()*DEATH_MSGS.length)];
    bestEl.textContent = best;
    overEl.classList.remove('hidden');
  }
  function toMenu(){ state = STATE.MENU; overEl.classList.add('hidden'); menuEl.classList.remove('hidden'); }

  // Démarrage : clic (desktop) + toucher (iOS). preventDefault tue le "click fantôme" iOS.
  document.getElementById('startBtn').addEventListener('click', startGame);
  menuEl.addEventListener('touchend', function(e){ e.preventDefault(); startGame(); }, {passive:false});

  function bindBtn(id, fn){
    const el = document.getElementById(id);
    el.addEventListener('click', fn);
    el.addEventListener('touchend', function(e){ e.preventDefault(); e.stopPropagation(); fn(); }, {passive:false});
  }
  bindBtn('retryBtn', startGame);
  bindBtn('menuBtn', toMenu);

  if('ontouchstart' in window){ document.getElementById('ctrlHint').textContent = 'Touche l\'écran pour lancer — puis glisse ton doigt'; }

  resize();
  window.addEventListener('resize', resize);
  bestEl.textContent = best;
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
